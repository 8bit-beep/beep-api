spring:
  profiles:
    active: dev
    include: rabbitmq, redis
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PW}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  upload:
    dir: ${UPLOAD_DIR}
  security:
    oauth2:
      client:
        registration:
          dauth:
            client-id: ${DAUTH_CLIENT_ID}
            client-secret: ${DAUTH_CLIENT_SECRET}
            scope:
              - profile:read
            redirect-uri: "${SERVER_DOMAIN}/login/oauth2/code/dauth"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
        provider:
          dauth:
            authorization-uri: https://dauth.b1nd.com/authorize
            token-uri: https://dodam-api.b1nd.com/oauth/token
            user-info-uri: https://dodam-api.b1nd.com/user/me
            user-name-attribute: username
application:
  domain:
    web: ${WEB_DOMAIN}
  jwt:
    refresh-exp: ${REFRESH_EXP}
    access-exp: ${ACCESS_EXP}
    prefix: Bearer
    header: Authorization
    secretKey: ${SECRET_KEY}
springdoc:
  api-docs:
    enabled: true
    version: openapi_3_0
    path: /v3/api-docs

  swagger-ui:
    operationsSorter: method
    path: /swagger-ui.html

dauth:
  client_id: ${DAUTH_CLIENT_ID}
  client_secret: ${DAUTH_CLIENT_SECRET}
cloud:
  aws:
    s3:
      bucket: ${BUCKET_NAME}
    region:
      static: ap-northeast-2
    stack:
      auto: false
    credentials:
      secret-key: ${AWS_IAM_SECRET}
      access-key: ${AWS_IAM_ACCESS}

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL}

server:
  forward-headers-strategy: framework
  port: 8080