spring:
  profiles:
    active: dev
    include: rabbitmq, redis
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PW}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  upload:
    dir: ${UPLOAD_DIR}
  mail:
    username: ${MAIL_USER}
    password: ${MAIL_PW}
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp.auth: true
        smtp.timeout: 50000
        smtp.starttls.enable: true
  security:
    oauth2:
      client:
        registration:
          dauth:
            client-id: ${DAUTH_CLIENT_ID}
            client-secret: ${DAUTH_CLIENT_SECRET}
            scope:
              - openid
              - read:profile
              - phone
            authorization-grant-type: authorization_code
            redirect-uri: "https://beepapi.com/login/oauth2/code/dauth"
            client-authentication-method: client_secret_post
        provider:
          dauth:
            issuer-uri: https://dauthapi.b1nd.com
            authorization-uri: https://dauthapi.b1nd.com/oauth/authorize
            token-uri: https://dauthapi.b1nd.com/oauth/token
            user-info-uri: https://dauthapi.b1nd.com/userinfo
            user-name-attribute: sub
application:
  jwt:
    refresh-exp: ${REFRESH_EXP}
    access-exp: ${ACCESS_EXP}
    prefix: Bearer
    header: Authorization
    secretKey: ${SECRET_KEY}
springdoc:
  api-docs:
    enabled: true
    version: openapi_3_0
    path: /v3/api-docs

  swagger-ui:
    operationsSorter: method
    path: /swagger-ui.html
dauth:
  client_id: ${DAUTH_ID}
  client_secret: ${DAUTH_SECRET}
cloud:
  aws:
    s3:
      bucket: ${BUCKET_NAME}
    region:
      static: AP_NORTHEAST_2 # 서울 리전
    stack:
      auto: false
    credentials:
      secret-key: ${AWS_IAM_SECRET}
      access-key: ${AWS_IAM_ACCESS}

server:
  port: 8085