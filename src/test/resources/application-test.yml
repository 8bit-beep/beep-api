spring:
  datasource:
    url: jdbc:mysql://localhost:3307/beep
    username: root
    password: a1234
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: a1234
  security:
    oauth2:
      client:
        registration:
          dauth:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - profile:read
            redirect-uri: "http://localhost:8085/login/oauth2/code/dauth"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
        provider:
          dauth:
            authorization-uri: https://dauth.b1nd.com/authorize
            token-uri: https://dodam-api.b1nd.com/oauth/token
            user-info-uri: https://dodam-api.b1nd.com/user/me
            user-name-attribute: username

application:
  jwt:
    refresh-exp: 86400000
    access-exp: 3600000
    prefix: Bearer
    header: Authorization
    secretKey: test-secret-key-for-testing-purposes-only-12345

dauth:
  client_id: test-client-id
  client_secret: test-client-secret
